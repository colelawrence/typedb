name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - cole
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'studio/**'
      - 'console/**'
      - 'scripts/build-studio.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          # Read base version from VERSION file
          BASE_VERSION=$(cat VERSION)
          DATE=$(date -u +"%Y%m%d")
          VERSION="${BASE_VERSION}-dev.${DATE}.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Build Studio
        run: ./scripts/build-studio.sh

      - uses: actions/upload-artifact@v4
        with:
          name: studio-assets
          path: server/assets/studio/
          retention-days: 1

  build:
    needs: [generate-version, build-studio]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: studio-assets
          path: server/assets/studio/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - name: Build Server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Console
        run: cargo build --release --target ${{ matrix.target }} --manifest-path console/Cargo.toml

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/typedb-${{ matrix.name }}/server
          mkdir -p dist/typedb-${{ matrix.name }}/console
          cp target/${{ matrix.target }}/release/typedb_server_bin dist/typedb-${{ matrix.name }}/server/
          cp server/config.yml dist/typedb-${{ matrix.name }}/server/
          cp console/target/${{ matrix.target }}/release/typedb-console dist/typedb-${{ matrix.name }}/console/
          cp binary/typedb dist/typedb-${{ matrix.name }}/
          chmod +x dist/typedb-${{ matrix.name }}/typedb
          chmod +x dist/typedb-${{ matrix.name }}/console/typedb-console
          cp LICENSE dist/typedb-${{ matrix.name }}/
          mkdir -p dist/typedb-${{ matrix.name }}/server/data
          tar -czvf "typedb-${{ needs.generate-version.outputs.version }}-${{ matrix.name }}.tar.gz" \
            -C dist typedb-${{ matrix.name }}
          echo "✓ Built typedb-${{ needs.generate-version.outputs.version }}-${{ matrix.name }}.tar.gz"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/typedb-${{ matrix.name }}/server
          New-Item -ItemType Directory -Force -Path dist/typedb-${{ matrix.name }}/console
          Copy-Item target/${{ matrix.target }}/release/typedb_server_bin.exe dist/typedb-${{ matrix.name }}/server/
          Copy-Item server/config.yml dist/typedb-${{ matrix.name }}/server/
          Copy-Item console/target/${{ matrix.target }}/release/typedb-console.exe dist/typedb-${{ matrix.name }}/console/
          Copy-Item binary/typedb.bat dist/typedb-${{ matrix.name }}/
          Copy-Item LICENSE dist/typedb-${{ matrix.name }}/
          New-Item -ItemType Directory -Force -Path dist/typedb-${{ matrix.name }}/server/data
          Compress-Archive -Path dist/typedb-${{ matrix.name }} -DestinationPath "typedb-${{ needs.generate-version.outputs.version }}-${{ matrix.name }}.zip"
          echo "✓ Built typedb-${{ needs.generate-version.outputs.version }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: typedb-${{ matrix.name }}
          path: typedb-*.*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [generate-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: typedb-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum typedb-*.tar.gz typedb-*.zip 2>/dev/null > checksums.txt || true
          cat checksums.txt

      - name: Compose release body
        run: |
          cat > dist/release_body.md <<'EOF'
          TypeDB server with embedded Studio and Console.

          Built from commit ${{ github.sha }}

          ## Quick Start

          ```bash
          # Extract and run server
          tar -xzf typedb-${{ needs.generate-version.outputs.version }}-<platform>.tar.gz
          cd typedb-<platform>
          ./typedb server
          ```

          ```bash
          # Connect with console (in another terminal)
          ./typedb console
          ```

          Studio available at http://localhost:8000/studio/

          ## Checksums

          ```text
          EOF
          cat dist/checksums.txt >> dist/release_body.md
          echo '```' >> dist/release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-version.outputs.version }}
          name: TypeDB ${{ needs.generate-version.outputs.version }}
          body_path: dist/release_body.md
          files: |
            dist/typedb-*.tar.gz
            dist/typedb-*.zip
            dist/checksums.txt
          draft: false
          prerelease: true
