# WASM Compatibility Test Suite
#
# This crate tests TypeDB functionality that should work in WASM environments.
# Tests use the `memory` feature (no RocksDB, no tokio, no filesystem).
#
# Run tests:
#   cargo test -p wasm-tests --no-default-features --features memory
#
# These tests verify:
# - Database lifecycle (create in-memory)
# - Transaction lifecycle (schema/write/read, commit/rollback)
# - Schema operations (define types, attributes, relations)
# - Data operations (insert, delete)
# - Query execution (match, fetch)

[package]
name = "wasm-tests"
edition = "2021"
version = "0.0.0"

[features]
default = ["rocksdb"]
rocksdb = [
    "database/rocksdb",
    "query/rocksdb",
    "storage/rocksdb",
]
memory = [
    "database/memory",
    "query/memory",
    "storage/memory",
]

[dependencies]
database = { path = "../database", default-features = false }
query = { path = "../query", default-features = false }
storage = { path = "../storage", default-features = false }
options = { path = "../common/options", default-features = false }
typeql = { git = "https://github.com/typedb/typeql", tag = "3.7.0", default-features = false }
concept = { path = "../concept", default-features = false }
encoding = { path = "../encoding", default-features = false }
answer = { path = "../answer", default-features = false }
executor = { path = "../executor", default-features = false }
function = { path = "../function", default-features = false }
compiler = { path = "../compiler", default-features = false }
ir = { path = "../ir", default-features = false }
lending_iterator = { path = "../common/lending_iterator", default-features = false }
resource = { path = "../resource", default-features = false }
error = { path = "../common/error", default-features = false }
itertools = { version = "0.10.5", default-features = false, features = ["use_alloc", "use_std"] }

[lib]
path = "lib.rs"

[[test]]
path = "tests/database_lifecycle.rs"
name = "test_database_lifecycle"

[[test]]
path = "tests/transaction_lifecycle.rs"
name = "test_transaction_lifecycle"

[[test]]
path = "tests/schema_operations.rs"
name = "test_schema_operations"

[[test]]
path = "tests/data_operations.rs"
name = "test_data_operations"

[[test]]
path = "tests/query_execution.rs"
name = "test_query_execution"

[[test]]
path = "tests/wasm_time_compatibility.rs"
name = "test_wasm_time_compatibility"

[[test]]
path = "tests/query_type_validation.rs"
name = "test_query_type_validation"
