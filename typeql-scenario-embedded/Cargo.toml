[package]
name = "typeql-scenario-embedded"
version = "0.1.0"
edition = "2021"
description = "Embedded TypeDB backend for the TypeQL scenario runner"
license = "MPL-2.0"

[dependencies]
typeql-scenario-runner = { path = "../typeql-scenario-runner" }
typedb-embedded = { path = "../embedded" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
