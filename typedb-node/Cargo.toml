[package]
name = "typedb-node"
version = "0.1.0"
edition = "2021"
description = "Node-API bindings for TypeDB embedded database"
license = "MPL-2.0"
keywords = ["typedb", "database", "node", "napi", "javascript", "typescript"]
categories = ["database", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["memory"]
memory = ["typedb-embedded/memory"]

[dependencies]
typedb-embedded = { path = "../embedded", default-features = false }
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
