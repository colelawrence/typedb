[package]
name = "typeql-scenario-runner"
version = "0.1.0"
edition = "2021"
description = "Executor for TypeQL scenarios with pluggable backends"
license = "MPL-2.0"

[dependencies]
typeql-scenario-parser = { path = "../typeql-scenario-parser" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
