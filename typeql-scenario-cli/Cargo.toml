[package]
name = "typeql-scenario-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for running TypeQL scenario tests"
license = "MPL-2.0"

[[bin]]
name = "typeql-scenario"
path = "src/main.rs"

[dependencies]
typeql-scenario-parser = { path = "../typeql-scenario-parser" }
typeql-scenario-runner = { path = "../typeql-scenario-runner" }
typeql-scenario-embedded = { path = "../typeql-scenario-embedded" }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
thiserror = "1.0"
colored = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
